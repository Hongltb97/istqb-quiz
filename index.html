<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISTQB Practice</title><link rel="stylesheet" href="style.css"></head><body><header><div><h1>ISTQB Practice</h1><p>Luyện đề, chấm điểm và ôn lại câu sai</p></div><button id="themeBtn" class="ghost">🌙</button></header><main>
<section id="home" class="panel"><h2>Chọn chế độ luyện</h2><div class="grid"><label>Bộ đề<select id="examSelect"></select></label><label>Số câu<select id="countSelect"><option value="all">Toàn bộ</option><option>10</option><option>20</option><option>40</option><option>60</option></select></label><label>Thời gian (phút)<input id="minutes" type="number" min="0" value="0"><small>0 = không giới hạn</small></label></div><div class="checks"><label><input id="shuffleQ" type="checkbox" checked> Trộn câu hỏi</label><label><input id="shuffleA" type="checkbox"> Trộn đáp án</label></div><div class="actions"><button id="startBtn">Bắt đầu</button><button id="wrongBtn" class="secondary">Luyện câu từng sai</button></div><div id="stats" class="stats"></div></section>
<section id="quiz" class="hidden"><div class="topbar"><span id="progress"></span><span id="timer"></span><button id="submitBtn" class="danger">Nộp bài</button></div><div class="quiz-layout"><aside id="nav"></aside><article class="panel"><div id="question"></div><div id="options"></div><div class="actions"><button id="prevBtn" class="secondary">← Trước</button><button id="flagBtn" class="ghost">☆ Đánh dấu</button><button id="nextBtn">Tiếp →</button></div></article></div></section>
<section id="result" class="panel hidden"><div id="score"></div><div class="actions"><button id="reviewBtn">Xem lại bài</button><button id="retryWrongBtn" class="secondary">Làm lại câu sai</button><button id="homeBtn" class="ghost">Về trang chủ</button></div></section>
</main><footer>Dữ liệu được lưu cục bộ trên trình duyệt.</footer><script src="app.js"></script></body></html>
